<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Donghua">
<title>Donghua</title>
<style>
body{margin:0;background:#111;color:#eee;font:16px -apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:12px;display:flex;gap:8px}
input{flex:1;padding:10px;border-radius:8px;border:0;background:#222;color:#eee}
button,select{padding:10px;border-radius:8px;border:0;background:#1bcc18;color:#000;font-weight:600}
.item{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid #222}
.item img{width:70px;height:46px;object-fit:cover;border-radius:6px;background:#222}
#player{display:none;position:sticky;top:0;background:#000;z-index:5;padding:8px}
.wrap{position:relative;padding-bottom:56.25%;height:0}
.wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#bar{display:flex;gap:8px;margin-top:8px}
#bar select{flex:1}
</style></head><body>
<header><input id="u" placeholder="Paste series page URL (optional)"><button onclick="load()">Go</button></header>
<div id="player"><div class="wrap"><iframe id="f" allowfullscreen allow="autoplay; fullscreen"></iframe></div>
<div id="bar"><select id="s" onchange="f.src=this.value"></select><button onclick="player.style.display='none';f.src=''">X</button></div></div>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id);
async function load(){
  const q=$('u').value.trim();
  $('list').textContent='Loading...';
  const r=await fetch('/api/list'+(q?'?url='+encodeURIComponent(q):''));
  const d=await r.json();
  if(d.error){$('list').textContent=d.error;return}
  $('list').innerHTML='';
  d.forEach(i=>{const e=document.createElement('div');e.className='item';
    e.innerHTML=(i.img?'<img src="'+i.img+'">':'')+'<div></div>';
    e.lastChild.textContent=i.title;e.onclick=()=>play(i.url);$('list').appendChild(e)});
}
async function play(url){
  const r=await fetch('/api/episode?url='+encodeURIComponent(url));
  const d=await r.json();
  if(d.error||!d.servers.length){alert(d.error||'No servers found');return}
  $('s').innerHTML='';
  d.servers.forEach(s=>{const o=document.createElement('option');o.value=s.src;o.textContent=s.name;$('s').appendChild(o)});
  $('f').src=d.servers[0].src;$('player').style.display='block';scrollTo(0,0);
}
load();
</script></body></html>
